<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Space Guy</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    html, body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    await cheerpjInit({version: 17});
    cheerpjCreateDisplay(-1, -1, document.getElementById("container"));
    // CheerpJ maps the site root to /app. Resolve the jar next to this page so the
    // same file works on GitHub Pages and on a local server.
    await cheerpjRunJar("/app" + new URL("SpaceGuy.jar", location.href).pathname);
  </script>
</body>
</html>
